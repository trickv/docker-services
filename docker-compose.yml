  music-assistant:
    container_name: music-assistant
    image: ghcr.io/music-assistant/server:latest
    network_mode: host
    restart: unless-stopped
    privileged: true
    volumes:
      - ./music-assistant/data:/data
      - /mnt/music:/mnt/music

  
  hass:
    container_name: hass
    image: homeassistant/home-assistant:stable
    volumes:
      - ./hass-config:/config
    devices:
      - /dev/ttyUSB0
    environment:
      - TZ=America/Chicago
    restart: always
    network_mode: host
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hass.rule=Host(`hass.vanstaveren.us`)"
      - "traefik.http.routers.hass.entrypoints=websecure"
      - "traefik.http.routers.hass.tls.certresolver=le"
      - "traefik.http.services.hass.loadbalancer.server.port=8123"
      - com.centurylinklabs.watchtower.enable=true
  
  esphome:
    image: esphome/esphome:stable
    container_name: esphome
    restart: unless-stopped
    volumes:
      - /home/trick/src/github.com/trickv/my-esphome:/config
    mem_limit: 750m
    network_mode: host
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - "traefik.enable=true"
      - "traefik.http.routers.esphome.rule=Host(`esphome.home.v9n.us`)"
      - "traefik.http.routers.esphome.entrypoints=websecure"
      - "traefik.http.routers.esphome.tls.certresolver=le"
      - "traefik.http.routers.esphome.middlewares=github-auth"
      - "traefik.http.services.esphome.loadbalancer.server.port=6052"


  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    container_name: matter-server
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./matter:/data
      - /run/dbus:/run/dbus:ro
    mem_limit: 300m
    security_opt:
      - apparmor=unconfined
    labels:
      - com.centurylinklabs.watchtower.enable=true
    

  mqtt:
    container_name: mqtt
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - 1883:1883
    volumes:
      - ./mqtt:/mosquitto
    mem_limit: 50m
    labels:
      - com.centurylinklabs.watchtower.enable=true

  airsonic:
    container_name: airsonic
    image: linuxserver/airsonic
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
      #- CONTEXT_PATH=<URL_BASE> #optional
      #- JAVA_OPTS=<options> #optional
    volumes:
      - ./airsonic-config:/config
      - /mnt/music/Master_Collection:/music
    mem_limit: 1000m
    ports:
      - 4039:4040
      - 8444:8443
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.airsonic.rule=Host(`airsonic.home.v9n.us`)"
      - "traefik.http.routers.airsonic.entrypoints=websecure"
      - "traefik.http.routers.airsonic.tls.certresolver=le"
      - "traefik.http.services.airsonic.loadbalancer.server.port=4040"

  minidlna:
    image: giof71/minidlna
    container_name: minidlna
    network_mode: host
    environment:
      - MINIDLNA_ROOT_CONTAINER=M
      - MINIDLNA_DIR_A_1=/music
      - MINIDLNA_ENABLE_INOTIFY=YES
      - MINIDLNA_FRIENDLY_NAME=minidlna-desktop
      - MINIDLNA_FORCE_SORT_CRITERIA=+upnp:class,-dc:date,+upnp:album,+upnp:originalTrackNumber,+dc:title
      - PUID=1000
      - PGID=1000
    volumes:
      - /mnt/music/Master_Collection:/music:ro
      - ./minidlna/config/log:/log
      - ./minidlna/config/db:/db
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  snmp_exporter:
    image: prom/snmp-exporter:latest
    container_name: snmp-exporter
    restart: unless-stopped
    ports:
      - 9116:9116
    mem_limit: 50m
    labels:
      - com.centurylinklabs.watchtower.enable=true

