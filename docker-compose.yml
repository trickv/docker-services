  solaredge2mqtt:
    container_name: solaredge2mqtt
    image: ghcr.io/deroetzi/solaredge2mqtt:latest
    environment:
      - SE2MQTT_LOGGING_LEVEL=DEBUG
      - SE2MQTT_MODBUS__HOST=solaredge-inverter.home.vanstaveren.us
      - SE2MQTT_MQTT__BROKER=litecoin.home.vanstaveren.us
      - SE2MQTT_MQTT__USERNAME=anonymous
      - SE2MQTT_MQTT__PASSWORD=x
      - SE2MQTT_MONITORING__USERNAME=sp@vanstaveren.us
      - SE2MQTT_LOCATION__LATITUDE=41.8781
      - SE2MQTT_LOCATION__LONGITUDE=-88.0754
      - SE2MQTT_FORECAST__ENABLE=true
      - SE2MQTT_INFLUXDB__HOST=litecoin.home.vanstaveren.us
      - SE2MQTT_INFLUXDB__ORG=e783cb08b19c36d7
      - TZ="America/Chicago"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - com.centurylinklabs.watchtower.enable=true

  influxdb:
    container_name: influxdb
    image: influxdb:2
    restart: unless-stopped
    ports:
      - 8086:8086
    mem_limit: 200m
    volumes:
      - ./monitoring/influxdb/data:/var/lib/influxdb2
      - ./monitoring/influxdb/config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=influxdb
      - DOCKER_INFLUXDB_INIT_ORG=myorg
      - DOCKER_INFLUXDB_INIT_BUCKET=init_bucket
      - DOCKER_INFLUXDB_INIT_RETENTION=1w

  bb_exporter:
    image: prom/blackbox-exporter:latest
    container_name: bb
    restart: unless-stopped
    volumes:
      - ./monitoring/bb:/config
    ports:
      - 9115:9115
    mem_limit: 30m
    labels:
      - com.centurylinklabs.watchtower.enable=true
    command: --config.file=/config/blackbox.yml

# docker run -d --restart unless-stopped --name sb8200-exporter -p 9195:9195 sbrudenell/sb8200_exporter
  sb8200_exporter:
    image: sbrudenell/sb8200_exporter
    container_name: sb8200_exporter
    restart: unless-stopped
    ports:
      - 9195:9195
    mem_limit: 60m
  
  unifi-poller:
    container_name: unifi-poller
    image: golift/unifi-poller
    volumes:
      - ./monitoring/unifi-poller/unifi-poller.conf:/config/unifi-poller.conf
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    ports:
      - 9130:9130
    mem_limit: 20m

  prometheus:
    image: prom/prometheus:latest
    container_name: prom
    restart: unless-stopped
    volumes:
      - ./monitoring/prom/master:/prometheus
      - ./monitoring/prom/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - 9090:9090
    labels:
      - com.centurylinklabs.watchtower.enable=true
    mem_limit: 700m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.home.v9n.us`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls.certresolver=le"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      - "traefik.http.routers.prometheus.middlewares=prometheusauthmiddleware"
      # to create a password: echo $(htpasswd -nB user) | sed -e s/\\$/\\$\\$/g
      - "traefik.http.middlewares.prometheusauthmiddleware.basicauth.users=prometheus:$$apr1$$u13f5Obh$$ERJ3TfhQ/Wsz3gpwGj9gd1,hgscripts:$$apr1$$lMM3tlNn$$jaJu0WEaL2JzeTpgAkfs40"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention=30d
      - --web.enable-admin-api
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
  
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    volumes:
      - ./monitoring/grafana:/var/lib/grafana
    mem_limit: 250m
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.home.v9n.us`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=le"
      - "traefik.http.routers.grafana.middlewares=github-auth"
    environment:
      - "GF_INSTALL_PLUGINS=grafana-piechart-panel,flant-statusmap-panel"
      - "GF_AUTH_PROXY_ENABLED=true"
      - "GF_AUTH_PROXY_HEADER_NAME=X-Firwarded-User"
      - "GF_USERS_ALLOW_SIGN_UP=false"
      - "GF_USERS_AUTO_ASSIGN_ORG=true"
      - "GF_USERS_AUTO_ASSIGN_ORG_ROLE=Editor"
      - "GF_FOO_BAR=Editor"

  github-auth:
    container_name: github-auth
    image: thomseddon/traefik-forward-auth:latest # must run latest for auth mode because https://github.com/thomseddon/traefik-forward-auth/pull/217
    restart: unless-stopped
    mem_limit: 20m
    environment:
      - DEFAULT_PROVIDER=generic-oauth
      - PROVIDERS_GENERIC_OAUTH_AUTH_URL=https://github.com/login/oauth/authorize
      - PROVIDERS_GENERIC_OAUTH_TOKEN_URL=https://github.com/login/oauth/access_token
      - PROVIDERS_GENERIC_OAUTH_USER_URL=https://api.github.com/user
      - PROVIDERS_GENERIC_OAUTH_CLIENT_ID=4126728948d59d9ffe20
      - COOKIE_DOMAIN=home.v9n.us
      - AUTH_HOST=auth.home.v9n.us
      - LOG_LEVEL=trace
      - LOG_FORMAT=json
      - DOMAIN=vanstaveren.us
      - COOKIE_NAME=_fw_gh_auth2
      - CSRF_COOKIE_NAME=_fw_csrf_gh_auth2
    ports:
      - 4181:4181
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.github-auth.forwardauth.address=http://172.17.0.1:4181"
      - "traefik.http.middlewares.github-auth.forwardauth.authResponseHeaders=X-Forwarded-User"
      - "traefik.http.services.github-auth.loadbalancer.server.port=4181"
      - "traefik.http.routers.github-auth.entrypoints=websecure"
      - "traefik.http.routers.github-auth.tls.certresolver=le"
      - "traefik.http.routers.github-auth.rule=Host(`auth.home.v9n.us`)"

  metra-timetable:
    image: nginx:alpine
    container_name: metra-timetable
    volumes:
      - /home/trick/src/github.com/trickv/metra-timetable:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.metra.rule=Host(`metra-timetable.home.v9n.us`)"
      - "traefik.http.routers.metra.entrypoints=websecure"
      - "traefik.http.routers.metra.tls.certresolver=le"
      # If using HTTPS:
      # - "traefik.http.routers.static-site.entrypoints=websecure"
      # - "traefik.http.routers.static-site.tls=true"
    environment:
      - NGINX_HOST=example.local
    restart: unless-stopped

  goatcounter:
    image: ghcr.io/riesinger/goatcounter-docker:2
    container_name: goatcounter
    restart: unless-stopped
    ports:
      - 8580:8080
    volumes:
      - ./goatcounter:/goatcounter/db
    environment:
      - GOATCOUNTER_DOMAIN=stats.home.v9n.us
      - GOATCOUNTER_EMAIL=trick@vanstaveren.us
      - GOATCOUNTER_PASSWORD=Mintel123!
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - "traefik.enable=true"

      # 📈 Protected main route (dashboard)
      - "traefik.http.routers.goatcounter.rule=Host(`stats.home.v9n.us`)"
      - "traefik.http.routers.goatcounter.entrypoints=websecure"
      - "traefik.http.routers.goatcounter.tls.certresolver=le"
      - "traefik.http.routers.goatcounter.middlewares=github-auth"

      # ✅ Public router for tracking scripts/beacons
      - "traefik.http.routers.goatcounter-public.rule=Host(`stats.home.v9n.us`) && (Path(`/count`) || Path(`/count.js`))"
      - "traefik.http.routers.goatcounter-public.entrypoints=websecure"
      - "traefik.http.routers.goatcounter-public.priority=100"
      - "traefik.http.routers.goatcounter-public.service=goatcounter@docker"



# docker run -d -p 3000:8080 --add-host=host.docker.internal:host-gateway -v open-webui:/app/backend/data --name open-webui --restart always ghcr.io/open-webui/open-webui:main
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - 3001:8080
    volumes:
      - ./open-webui:/app/backend/data
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - "traefik.enable=true"
      - "traefik.http.routers.open-webui.rule=Host(`oi.home.v9n.us`)"
      - "traefik.http.routers.open-webui.entrypoints=websecure"
      - "traefik.http.routers.open-webui.tls.certresolver=le"
      - "traefik.http.routers.open-webui.middlewares=github-auth"

  # https://community.home-assistant.io/t/openwakeword-docker/626131/5
  openwakeword:
    container_name: openwakeword
    image: rhasspy/wyoming-openwakeword
    user: 1001:1001
    volumes:
      - ./wakeword/data:/data
      - ./wakeword/custom:/custom
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    command:
      --preload-model 'ok_nabu'
      --custom-model-dir /custom
      --debug
      #--trigger-level 1
# --threshold Wake word model threshold (0-1, default: 0.5); hass uses 0.5 as default too
# --trigger-level Number of activations before detection (default: 4); hass uses 1 as default?!
    restart: unless-stopped
    ports:
      - 10400:10400/tcp
    mem_limit: 100m
    labels:
      - com.centurylinklabs.watchtower.enable=true

  whisper:
    image: rhasspy/wyoming-whisper:latest
    container_name: whisper
    ports:
      - 10300:10300
    restart: unless-stopped
    volumes:
      - ./whisper-data:/data
    command: [ "--model", "tiny", "--language", "en" ]
# models are {{tiny,base,small,medium,large},-int8}
    mem_limit: 500m
    labels:
      - com.centurylinklabs.watchtower.enable=true

  piper:
    image: rhasspy/wyoming-piper:latest
    container_name: piper
    ports:
      - 10200:10200
    restart: unless-stopped
    volumes:
      - ./piper-data:/data
    command: [ "--voice", "en_US-lessac-medium" ]
    mem_limit: 250m
    labels:
      - com.centurylinklabs.watchtower.enable=true

  codeserver:
    image: codercom/code-server:latest
    container_name: code-server
    volumes:
      - $HOME:/home/coder/home
    restart: unless-stopped
    ports:
      - 7808:8080
    environment:
      - PASSWORD=freewilly
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - "traefik.enable=true"
      - "traefik.http.routers.codeserver.rule=Host(`codeserver.home.v9n.us`)"
      - "traefik.http.routers.codeserver.entrypoints=websecure"
      - "traefik.http.routers.codeserver.tls.certresolver=le"
      - "traefik.http.routers.codeserver.middlewares=github-auth"


  proxy_prometheus:
    container_name: tcpproxy_prometheus
    image: amaysim/docker-tcp-proxy
    restart: unless-stopped
    environment:
      - CONTAINER_PORT=80
      - REMOTE_HOST=172.16.17.23
      - REMOTE_PORT=9090
    mem_limit: 10m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheusproxy.rule=Host(`prometheus-utc.home.v9n.us`)"
