services:
  traefik:
    container_name: traefik
    image: traefik:v2.11
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entryPoints.websecure.address=:443"
      - "--entryPoints.web.address=:80"
      - "--certificatesResolvers.le.acme.email=trick@vanstaveren.us"
      - "--certificatesResolvers.le.acme.storage=/acme/acme.json"
      #- "--certificatesResolvers.le.acme.storage=/acme/acme-staging.json"
      #- "--certificatesResolvers.le.acme.caServer=https://acme-staging-v02.api.letsencrypt.org/directory"
      - "--certificatesResolvers.le.acme.tlsChallenge=true"
      - "--metrics.prometheus.entryPoint=metrics"
      - "--metrics.prometheus=true"
      - "--entryPoints.metrics.address=:7082"
      - "--entrypoints.traefik.address=:8079" # dashboard port
      #- "--accesslog=true"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik/acme/:/acme/"
      - "./traefik/config/:/etc/traefik/dynamic/"  # Mounting the directory for custom config
    labels:
      - com.centurylinklabs.watchtower.enable=true
    network_mode: host
    mem_limit: 100m
  
  tcpproxy_traefik_metrics:
    container_name: tcpproxy_traefik_metrics
    image: amaysim/docker-tcp-proxy
    restart: unless-stopped
    environment:
      - CONTAINER_PORT=80
      - REMOTE_HOST=172.17.0.1
      - REMOTE_PORT=7082
    mem_limit: 10m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefikmetrics.rule=Host(`traefikmetrics.yellow.v9n.us`)"
      - "traefik.http.routers.traefikmetrics.entrypoints=websecure"
      - "traefik.http.routers.traefikmetrics.tls.certresolver=le"
      - "traefik.http.services.traefikmetrics.loadbalancer.server.port=80"
      - "traefik.http.routers.traefikmetrics.middlewares=traefikmetricsauth"
      # Note: when used in docker-compose.yml all dollar signs in the hash need to be doubled for escaping.
      # To create user:password pair, it's possible to use this command:
      # echo $(htpasswd -nB user) | sed -e s/\\$/\\$\\$/g
      - "traefik.http.middlewares.traefikmetricsauth.basicauth.users=foo:$$2y$$05$$/GTEnG5nDTMb2wAyPiioFeR1igHfvU31f9xRLCOvS0VBDYzY16BPe" # this is in /etc/prometheus/prometheus.yml on hg.v9n.us

  whoami:
    image: containous/whoami
    restart: unless-stopped
    mem_limit: 20m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami44.entrypoints=websecure"
      - "traefik.http.routers.whoami44.tls.certresolver=le"
      - "traefik.http.routers.whoami44.rule=Host(`whoami.yellow.v9n.us`)"
      - "traefik.http.services.whoami44.loadbalancer.server.port=80"

  watchtower:
    image: nickfedor/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: 1          # Only include containers with enable label
    #command: -i 10
    mem_limit: 75m


  look-up:
    image: nginx:alpine
    container_name: look-up
    restart: unless-stopped
    volumes:
      - /home/trick/src/github.com/trickv/look-up/dist:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.look-up.entrypoints=websecure"
      - "traefik.http.routers.look-up.tls.certresolver=le"
      - "traefik.http.routers.look-up.rule=Host(`look-up.yellow.v9n.us`)"
      - "traefik.http.services.look-up.loadbalancer.server.port=80"

  lbv:
    image: nginx:alpine
    container_name: lbv
    restart: unless-stopped
    volumes:
      - /home/trick/src/github.com/trickv/lbv:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lbv.entrypoints=websecure"
      - "traefik.http.routers.lbv.tls.certresolver=le"
      - "traefik.http.routers.lbv.rule=Host(`values-dev.yellow.v9n.us`)"
      - "traefik.http.services.lbv.loadbalancer.server.port=80"

  task-dashboard:
    image: nginx:alpine
    container_name: task-dashboard
    restart: unless-stopped
    volumes:
      - /home/trick/clawd-tasker/data/workspace/dashboard:/usr/share/nginx/html:ro
      - /home/trick/clawd-tasker/data/workspace/dashboard/.htpasswd:/etc/nginx/.htpasswd:ro
      - /home/trick/clawd-tasker/data/workspace/dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.task-dashboard.entrypoints=websecure"
      - "traefik.http.routers.task-dashboard.tls.certresolver=le"
      - "traefik.http.routers.task-dashboard.rule=Host(`task-dashboard.yellow.v9n.us`)"
      - "traefik.http.services.task-dashboard.loadbalancer.server.port=80"
  
  steve-dashboard:
    image: nginx:alpine
    container_name: steve-dashboard
    restart: unless-stopped
    volumes:
      - /home/trick/claws/steve/data/workspace/dashboard:/usr/share/nginx/html:ro
      - /home/trick/claws/steve/data/workspace/dashboard/.htpasswd:/etc/nginx/.htpasswd:ro
      - /home/trick/claws/steve/data/workspace/dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.steve-dashboard.entrypoints=websecure"
      - "traefik.http.routers.steve-dashboard.tls.certresolver=le"
      - "traefik.http.routers.steve-dashboard.rule=Host(`steve-dashboard.yellow.v9n.us`)"
      - "traefik.http.services.steve-dashboard.loadbalancer.server.port=80"
  
  c3po-dashboard:
    image: nginx:alpine
    container_name: c3po-dashboard
    restart: unless-stopped
    volumes:
      - /home/trick/claws/slackers/data/workspace/public-site:/usr/share/nginx/html:ro
      - /home/trick/claws/slackers/data/workspace/public-site/.htpasswd:/etc/nginx/.htpasswd:ro
      - /home/trick/claws/slackers/data/workspace/public-site/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.c3po-dashboard.entrypoints=websecure"
      - "traefik.http.routers.c3po-dashboard.tls.certresolver=le"
      - "traefik.http.routers.c3po-dashboard.rule=Host(`c3po-dashboard.yellow.v9n.us`)"
      - "traefik.http.services.c3po-dashboard.loadbalancer.server.port=80"

  # RTL-SDR EOT/DPU decoder. Writes trains/passes/signal CSVs + a 60s
  # liveness heartbeat into the repo's data/ dir (dashboard mounts it ro).
  # NOTE: only one process may use the dongle — don't also run traintap
  # bare-metal / via systemd on this host.
  traintap:
    build: /home/trick/src/github.com/trickv/eot-watch
    container_name: traintap
    restart: unless-stopped
    devices:
      - /dev/bus/usb:/dev/bus/usb   # RTL-SDR; if not found try privileged: true
    volumes:
      - /home/trick/src/github.com/trickv/eot-watch/data:/data
    mem_limit: 512m
    # default image CMD: --mode eot, CSVs + heartbeat into /data

  traintap-dashboard:
    build: /home/trick/src/github.com/trickv/eot-watch/dashboard
    container_name: traintap-dashboard
    restart: unless-stopped
    volumes:
      - /home/trick/src/github.com/trickv/eot-watch/data:/data:ro
    environment:
      - DATA_DIR=/data
      - TRACK_DISTANCE_M=173   # antenna -> middle of the freight track (Doppler fit)
    mem_limit: 150m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traintap-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traintap-dashboard.tls.certresolver=le"
      - "traefik.http.routers.traintap-dashboard.rule=Host(`traintap.yellow.v9n.us`)"
      - "traefik.http.services.traintap-dashboard.loadbalancer.server.port=8000"
