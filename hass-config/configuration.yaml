shell_command:
  boiler_on: !secret boiler_on_notify_shell_command
  boiler_off: !secret boiler_off_notify_shell_command
  octopi_off: !secret octopi_shutdown_command

sensor:
  - platform: history_stats
    name: Boiler East ON Today
    entity_id: switch.east
    state: "on"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Boiler West ON Today
    entity_id: switch.west
    state: "on"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Boiler East ON Today Ratio
    entity_id: switch.east
    state: "on"
    type: ratio
    start: "{{ now().replace(hour=0, minute=0, second=0) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Boiler West ON Today Ratio
    entity_id: switch.west
    state: "on"
    type: ratio
    start: "{{ now().replace(hour=0, minute=0, second=0) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Forced Air ON Today Time
    entity_id: sensor.forced_air_action
    state: "heating"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Forced Air ON Today Ratio
    entity_id: sensor.forced_air_action
    state: "heating"
    type: ratio
    start: "{{ now().replace(hour=0, minute=0, second=0) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Forced Air Cooling ON Today Ratio
    entity_id: sensor.forced_air_action
    state: "cooling"
    type: ratio
    start: "{{ now().replace(hour=0, minute=0, second=0) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Forced Air Cooling ON Today Time
    entity_id: sensor.forced_air_action
    state: "cooling"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Bathroom Floor Heating Daily
    entity_id: sensor.bathroom_floor_heating_action
    state: "heating"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Boiler East ON rolling ratio 24h
    entity_id: switch.east
    state: "on"
    type: ratio
    end: "{{ now() }}"
    duration:
      hours: 24
  - platform: history_stats
    name: Boiler East ON rolling ratio 6h
    entity_id: switch.east
    state: "on"
    type: ratio
    end: "{{ now() }}"
    duration:
      hours: 6
  - platform: comed_hourly_pricing
    monitored_feeds:
      - type: five_minute
      - type: current_hour_average

  - platform: derivative
