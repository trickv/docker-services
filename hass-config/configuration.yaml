template:
  - sensor:
      - name: "Claude Session Reset"
        device_class: timestamp
        state: "{{ states('sensor.claude_code_session_reset_time') | as_datetime | as_local }}"
      - name: "Claude Week Reset"
        device_class: timestamp
        state: "{{ states('sensor.claude_code_week_reset_time') | as_datetime | as_local }}"
      - name: "Grid Consumption Today Derived"
        unit_of_measurement: "Wh"
        state: >
          {{ float(states("sensor.total_daily_energy")) - float(states("sensor.solaredge_energy_today")) }}
        device_class: energy
        state_class: total
      - name: "Forced Air Action"
        state: "{{ state_attr('climate.dining_room_2', 'hvac_action') }}"
      - name: "Bathroom floor heating action"
        state: "{{ state_attr('climate.ditra_heat_e_rs1', 'hvac_action') }}"
      - name: "Bathroom floor heating energy daily"
        unit_of_measurement: "kWh"
        state: "{{ (states('sensor.bathroom_floor_heating_daily') | float * 0.475) | round(2) }}"
        device_class: "energy"
      - name: "Difference between bedrooms"
        unit_of_measurement: "F"
        state: "{{ float(states('sensor.bedroom_temperature_2')) - float(states('sensor.dining_room_2_temperature')) }}"
      - name: "Combined Solar.Forecast Today"
        unit_of_measurement: "kWh"
        state: "{{ float(states('sensor.forecast_solar_south_energy_production_today')) + float(states('sensor.forecast_solar_west_energy_production_today')) + float(states('sensor.forecast_solar_east_energy_production_today')) }}"
      - name: "Combined Solar.Forecast Tomorrow"
        unit_of_measurement: "kWh"
        state: "{{ float(states('sensor.forecast_solar_south_energy_production_tomorrow')) + float(states('sensor.forecast_solar_west_energy_production_tomorrow')) + float(states('sensor.forecast_solar_east_energy_production_tomorrow')) }}"
  - trigger:
      - platform: event
        event_type: sonde_alert
        event_data:
          user: person.matt
    sensor:
      - name: "Sonde Alert Matt"
        state: "{{ trigger.event.data.sonde_id }}"
        attributes:
          sonde_id: "{{ trigger.event.data.sonde_id }}"
          distance_km: "{{ trigger.event.data.distance_km }}"
          sonde_lat: "{{ trigger.event.data.sonde_lat }}"
          sonde_lon: "{{ trigger.event.data.sonde_lon }}"
          sonde_alt: "{{ trigger.event.data.sonde_alt }}"
          sonde_url: "{{ trigger.event.data.sonde_url }}"
          landed_ago: "{{ trigger.event.data.landed_ago }}"
          message: "{{ trigger.event.data.message }}"
          last_updated: "{{ now().isoformat() }}"
  - trigger:
      - platform: event
        event_type: sonde_alert
        event_data:
          user: person.patrick_van_staveren
    sensor:
      - name: "Sonde Alert Trick"
        state: "{{ trigger.event.data.sonde_id }}"
        attributes:
          sonde_id: "{{ trigger.event.data.sonde_id }}"
          distance_km: "{{ trigger.event.data.distance_km }}"
          sonde_lat: "{{ trigger.event.data.sonde_lat }}"
          sonde_lon: "{{ trigger.event.data.sonde_lon }}"
          sonde_alt: "{{ trigger.event.data.sonde_alt }}"
          sonde_url: "{{ trigger.event.data.sonde_url }}"
          landed_ago: "{{ trigger.event.data.landed_ago }}"
          message: "{{ trigger.event.data.message }}"
          last_updated: "{{ now().isoformat() }}"

intent_script:
  GetTime:
    speech:
      text: The time is {{ now().strftime('%-I:%M') }}

mqtt:
  sensor:
    - name: "OctoPrint Z Height"
      state_topic: "octoPrint/event/ZChange"
      unit_of_measurement: "mm"
      value_template: "{{ value_json.new }}"
      icon: "mdi:axis-z-arrow"
    - name: "solaredge2mqtt Solaredge Total Energy"
      state_topic: "solaredge/modbus/inverter"
      availability:
        - topic: "solaredge/status"
      unit_of_measurement: "Wh"
      value_template: "{{ value_json.energytotal }}"
      json_attributes_topic: "solaredge/modbus/inverter"
      expire_after: 60
    - name: "solaredge2mqtt Solaredge Power Actual"
      state_topic: "solaredge/modbus/inverter"
      availability:
