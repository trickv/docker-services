rest_command:
  radiopi_pan_left:
    url: "http://radiopi:8070/pan/left"
    method: "get"
  radiopi_pan_right:
    url: "http://radiopi:8070/pan/right"
    method: "get"
  radiopi_zoom_in:
    url: "http://radiopi:8070/zoom/in"
    method: "get"
  radiopi_zoom_out:
    url: "http://radiopi:8070/zoom/out"
    method: "get"
  radiopi_tilt_up:
    url: "http://radiopi:8070/tilt/up"
    method: "get"
  radiopi_tilt_down:
    url: "http://radiopi:8070/tilt/down"
    method: "get"
  radiopi_reset:
    url: "http://radiopi:8070/reset"
    method: "get"
  radiopi_focus_infinity:
    url: "http://radiopi:8070/focus/infinity"
    method: "get"
  octoprint_z100:
    url: "http://octopi/api/printer/command"
    method: "post"
    headers:
      X-Api-Key: !secret octoprint_api_key
      Content-Type: "application/json"
    payload: '{"commands": ["G0 Z100"]}'
  octoprint_hotend_warm:
    url: "http://octopi/api/printer/command"
    method: "post"
    headers:
      X-Api-Key: !secret octoprint_api_key
      Content-Type: "application/json"
    payload: '{"commands": ["M104 S190"]}'
  octoprint_hotend_off:
    url: "http://octopi/api/printer/command"
    method: "post"
    headers:
      X-Api-Key: !secret octoprint_api_key
      Content-Type: "application/json"
    payload: '{"commands": ["M104 S0"]}'
