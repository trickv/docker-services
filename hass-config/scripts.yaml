notify_a_person_on_all_devices:
  description: Send a notification to a specific person entity on all linked devices.
  fields:
    person:
      description: Person entity to notify (e.g., person.your_name)
      example: person.john_doe
      required: true
      selector:
        entity:
          domain: person
    title:
      description: Notification title
      example: Washing Machine
      required: true
      selector:
        text:
    message:
      description: Notification message
      example: Your laundry is done!
      required: true
      selector:
        text:
    url:
      description: Optional URL to open when notification is tapped
      example: /lovelace/cameras
      required: false
      selector:
        text:
  sequence:
  - variables:
      notification_targets: '{{ state_attr(person, ''device_trackers'') | default([])
        | reject(''search'', ''chi_linux'') | map(''replace'', ''device_tracker.'',
        ''mobile_app_'') | list }}'
  - repeat:
      for_each: '{{ notification_targets }}'
      sequence:
      - action: notify.{{ repeat.item }}
        data:
          title: '{{ title }}'
          message: '{{ message }}'
          data: '{% if url is defined and url %}{"url": "{{ url }}"}{% else %}{}{% endif
            %}'
  - data:
      name: Notification Sent
      message: 'Sent "{{ title }}" to {{ state_attr(person, ''friendly_name'') |
        default(person) }} on {{ notification_targets | length }} device(s): {{ notification_targets
        | map(''replace'', ''mobile_app_'', '''') | join('', '') }}'
      entity_id: '{{ person }}'
    action: logbook.log
  alias: 'Notify a person on all devices '
  mode: queued
seek_sonos_track:
  alias: Seek Sonos Track v2
  description: Skips tracks until a specified song is found.
  mode: queued
  fields:
    target_title:
      description: The title of the song to seek.
      example: Daughters
      required: true
      selector:
        text:
    target_player:
      description: The Sonos media player entity to control.
      example: media_player.living_room
      required: true
      selector:
        entity:
          domain: media_player
  sequence:
  - variables:
      target_track: '{{ target_title }}'
      media_player: '{{ target_player }}'
  - action: script.sonos_back_to_top
    metadata: {}
    data:
      media_player: '{{ media_player }}'
  - variables:
      queue_length: '{{ state_attr(media_player, ''queue_size'') | int(0) }}'
  - repeat:
      sequence:
      - variables:
          current_track: '{{ state_attr(media_player, ''media_title'') }}'
      - action: media_player.media_next_track
        metadata: {}
        data: {}
        target:
          entity_id: '{{ media_player }}'
      - wait_template: "{{ state_attr(media_player, 'media_title') != current_track
          \n   and states[media_player].attributes.media_title is not none }}\n"
        timeout: 00:00:05
      while:
      - condition: template
        value_template: '{{ not is_state_attr(media_player, ''media_title'', target_track)
          }}'
      - condition: template
        value_template: '{{ repeat.index <= queue_length }}'
  - action: media_player.media_play
    metadata: {}
    data: {}
    target:
      entity_id: '{{ media_player }}'
