seek_sonos_track_kids_br:
  alias: Seek Sonos Track Kids BR
  description: Skips tracks until a specified song is found.
  mode: single
  fields:
    target_title:
      description: The title of the song to seek.
      example: Daughters
      required: true
      selector:
        text:
  sequence:
  - variables:
      target_track: '{{ target_title }}'
  - action: script.baby_br_back_to_top
    metadata: {}
    data: {}
  - repeat:
      sequence:
      - variables:
          current_track: '{{ state_attr(''media_player.baby_br'', ''media_title'')
            }}'
      - action: media_player.media_next_track
        metadata: {}
        data: {}
        target:
          entity_id: media_player.baby_br
      - wait_template: "{{ state_attr('media_player.baby_br', 'media_title') != current_track
          \n   and states.media_player.baby_br.attributes.media_title is not none
          }}\n"
        timeout: 00:00:05
      while:
      - condition: template
        value_template: '{{ not is_state_attr(''media_player.baby_br'', ''media_title'',
          target_track) }}'
      - condition: template
        value_template: '{{ repeat.index <= 200 }}'
  - action: media_player.media_play
    metadata: {}
    data: {}
    target:
      entity_id: media_player.baby_br
