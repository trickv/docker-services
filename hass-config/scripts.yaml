new_script:
  alias: 'Boiler away: save state + heat down'
  sequence:
  - variables:
      west: '{{ state_attr(''climate.west_esp'', ''temperature'') }}'
      east: '{{ state_attr(''climate.east_esp'', ''temperature'') }}'
  - action: notify.mobile_app_trickyiphone16
    metadata: {}
    data:
      message: '{{ west }}'
    enabled: false
  - action: number.set_value
    metadata: {}
    data:
      value: 1
    target:
      entity_id: input_number.boiler_west_setpoint
    enabled: false
  - action: input_number.set_value
    metadata: {}
    data:
      value: '{{ west }}'
    target:
      entity_id: input_number.boiler_west_setpoint
    enabled: true
  - action: input_number.set_value
    metadata: {}
    data:
      value: '{{ east }}'
    target:
      entity_id: input_number.boiler_east_setpoint
    enabled: true
  - action: climate.set_temperature
    metadata: {}
    data:
      temperature: 50
    target:
      entity_id:
      - climate.east_esp
      - climate.west_esp
  description: ''
boiler_away_restore:
  alias: 'Boiler away: restore'
  sequence:
  - action: climate.set_temperature
    metadata: {}
    data:
      temperature: '{{ states(''input_number.boiler_east_setpoint'') }}'
    target:
      entity_id: climate.east_esp
  - action: climate.set_temperature
    metadata: {}
    data:
      temperature: '{{ states(''input_number.boiler_west_setpoint'') }}'
    target:
      entity_id: climate.west_esp
  description: ''
