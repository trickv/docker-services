reset_sonos_for_nap:
  alias: Reset Sonos for nap (generic)
  description: Stops media and sets volume if not currently playing
  fields:
    media_player:
      description: The Sonos media player to reset
      example: media_player.office
      required: true
      selector:
        entity:
          domain: media_player
    volume_level:
      description: Volume level to set (0.0-1.0)
      example: 0.11
      required: true
      selector:
        number:
          min: 0
          max: 1
          step: 0.01
  sequence:
  - if:
    - condition: template
      value_template: '{{ is_state(media_player, "playing") }}'
    then:
    - stop: Media is playing so don't annoy the operator.
  - action: media_player.media_stop
    target:
      entity_id: '{{ media_player }}'
  - action: media_player.volume_set
    data:
      volume_level: '{{ volume_level }}'
    target:
      entity_id: '{{ media_player }}'
  mode: single
  icon: mdi:chat-sleep
