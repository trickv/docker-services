http:
  routers:
    redirect-to-https:
      entryPoints:
        - web
      rule: "HostRegexp(`{host:.+}`)"
      middlewares:
        - redirect-to-https
      service: noop@internal

  middlewares:
    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: false  # Set to true for 301, false for 302

# 'noop@internal' is a built-in dummy service that does nothing.
